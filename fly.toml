app = "cyberjobs-dashboard"
primary_region = "bom"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  SOC_STRICT = "true"
  REQUIRE_RESUME = "true"
  SCAN_INTERVAL_MINUTES = "30"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "cyberjobs_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[services.tcp_checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "30s"
  port = 8080
